name: "Trigger Android Cross-Compilation Test"

on:
  workflow_dispatch:

jobs:
  secure-recon-env:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: System Environment Optimization
        run: |
          echo "======================================================="
          echo "🚀 OPTIMIZING LINUX HOST CONFIGURATIONS"
          echo "======================================================="
          # Free up extra execution disk space by clearing unneeded tool caches
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          
          # Update native package references cleanly
          sudo apt-get update -y

      - name: Deploy and Configure Tailscale Engine (Native Ubuntu Mirrors)
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo "Installing Tailscale directly from native Ubuntu repositories..."
          # This completely avoids curl/web scripts and uses pre-verified system packages
          sudo apt-get update -y
          sudo apt-get install tailscale -y
          
          echo "Establishing encrypted mesh network routing path..."
          sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=lab-tablet-runner --reset
          
          # Retrieve assigned network reference address
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Target Interface IP successfully mapped: $TS_IP"

      - name: Deploy, Configure, and Launch RedAmon Automatically
        run: |
          echo "Cloning target framework directory layers into workspace..."
          git clone https://github.com
          cd redamon
          
          if [ -f ".env.example" ]; then
              echo "Parsing core service templates..."
              # Modify configuration boundaries to route all outbound discovery traffic through Tor
              sed 's/USE_TOR_FOR_RECON=false/USE_TOR_FOR_RECON=true/g' .env.example > .env
              echo "Tor configuration profiles verified and locked."
              
              echo "Initializing background container engines..."
              # Launch isolated orchestration layers using native Linux Docker services
              sudo docker compose up -d
              echo "RedAmon container infrastructure deployed successfully."
          else
              echo "::warning:: Configuration layout structures are missing. Core boot skipped."
          fi

      - name: Maintain Active Session & Await Tablet Connection
        run: |
          echo -e "\n======================================================="
          echo "🚀 STREAMLINED LINUX DOCKER WORKSPACE LIVE AND READY"
          echo "======================================================="
          echo "Tailscale Hostname : lab-tablet-runner"
          echo "Tailscale IP       : ${{ env.TAILSCALE_IP }}"
          echo "RedAmon Dashboard  : http://lab-tablet-runner:3000"
          echo "Proxy Routing Engine: Internal Tor Overlay Enabled"
          echo "=======================================================\n"
          
          # Maintain background engine state for secure remote operation
          elapsed=0
          while [ $elapsed -lt 18000 ]; do
              echo "[$(date)] Core environments operational. Manage your scans directly from your Samsung Tab browser..."
              sleep 300
              elapsed=$((elapsed + 300))
          done

