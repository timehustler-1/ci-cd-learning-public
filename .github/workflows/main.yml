name: "Trigger Android Cross-Compilation Test"

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # 1. Enable RDP & disable Network Level Authentication (NLA)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force

          # 2. Open Firewall port 3389 cleanly for incoming remote streams
          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

          # 3. Apply configurations via structural restarts
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          # Clear out any collision profiles from dirty checkout steps
          if (Get-LocalUser -Name "kaliuser" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "kaliuser"
          }

          # Standardize user workspace credentials permanently
          $securePass = ConvertTo-SecureString "KaliPass2026!" -AsPlainText -Force
          New-LocalUser -Name "kaliuser" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "kaliuser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "kaliuser"
          Write-Host "Static credentials for user 'kaliuser' registered successfully."

      - name: Install Tailscale
        run: |
          Write-Host "Deploying Tailscale via headless package manager automation..."
          # FIX: Bypasses msiexec extraction deadlocks entirely by compiling the package through Choco
          choco install tailscale -y --no-progress
          
          # Block wrapper verification validation loop
          $exePath = "C:\Program Files\Tailscale\tailscale.exe"
          $timeoutSec = 45
          $elapsed = 0
          while (-not (Test-Path $exePath) -and $elapsed -lt $timeoutSec) {
              Start-Sleep -Seconds 2
              $elapsed += 2
              Write-Host "Verifying service registration profile on system... ($elapsed s)"
          }

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # Append installation paths into the active step context shell runtime environment
          $env:Path += ";C:\Program Files\Tailscale"
          $exePath = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $exePath)) {
              Write-Error "CRITICAL: Tailscale installation step did not finish routing files cleanly."
              exit 1
          }

          Write-Host "Connecting tunnel node using static permanent workspace identity..."
          # The reset flag clears prior hanging handshake traces instantly
          & "$exePath" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=lab-tablet-runner --reset
          
          # Poll interface for assigned network address properties
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & "$exePath" ip -4
              if ($tsIP) { $tsIP = $tsIP.Trim() }
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale overlay engine timed out establishing virtual port routes."
              exit 1
          }
          
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Validating network stack connectivity..."
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "Local interface pipeline is actively dropping port 3389 packets."
              exit 1
          }
          Write-Host "TCP handshake loop successful! Host computer ready for remote client interaction."

      - name: Maintain Connection
        run: |
          Write-Host "`n==============================================="
          Write-Host "🚀 PERMANENT WORKSPACE CONNECTED AND ACTIVE"
          Write-Host "==============================================="
          Write-Host "Tailscale IP   : $env:TAILSCALE_IP"
          Write-Host "Magic DNS Host : lab-tablet-runner.tail9a3319.ts.net"
          Write-Host "Username       : kaliuser"
          Write-Host "Password       : KaliPass2026!"
          Write-Host "===============================================\n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Machine session active. Awaiting tablet client connection stream..."
              Start-Sleep -Seconds 300
          }
